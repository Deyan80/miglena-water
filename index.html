<style>
:root{--ink:#f6ecd3;--glass:rgba(8,22,22,.46);--line:rgba(255,226,150,.30);--gold:#f3cf7a;--card:rgba(8,20,20,.82)}
:root[data-theme=light]{--ink:#2a2010;--glass:rgba(255,250,236,.58);--line:rgba(120,84,20,.38);--gold:#8a5a10;--card:rgba(255,251,240,.9)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#04100f;overscroll-behavior:none;touch-action:none;font-family:Manrope,system-ui,sans-serif;color:var(--ink)}
#gl{position:fixed;left:0;top:0;display:block;touch-action:none}
#brand{position:fixed;left:max(18px,env(safe-area-inset-left));top:max(16px,env(safe-area-inset-top));pointer-events:none;z-index:4;text-shadow:0 1px 14px rgba(0,0,0,.5)}
:root[data-theme=light] #brand{text-shadow:0 1px 14px rgba(255,255,255,.7)}
#brand b{display:block;font:italic 600 clamp(20px,2.1vw,30px)/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.03em}
#brand i{display:block;font:400 10px/1 Manrope,sans-serif;letter-spacing:.26em;text-transform:uppercase;opacity:.78;margin-top:7px;font-style:normal}
#ui{position:fixed;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));display:flex;gap:9px;z-index:6}
#ui button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--ink);display:grid;place-items:center;cursor:pointer;font:600 12px Manrope,sans-serif;letter-spacing:.04em;padding:0;transition:transform .25s,border-color .25s,background .25s}
#ui button:hover,#ui button:focus-visible{transform:scale(1.08);border-color:var(--gold);outline:none}
#ui svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
:root[data-theme=dark] .i-sun,:root[data-theme=light] .i-moon{display:none}
#bSound .i-on{display:none}#bSound.on .i-on{display:block}#bSound.on .i-off{display:none}
#bSound:not(.on){animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(243,207,122,.12)}}
@media (max-aspect-ratio:1/1){#ui{flex-direction:column;gap:8px}#ui button{width:40px;height:40px}}
#hint{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));text-align:center;font:300 11px Manrope,sans-serif;letter-spacing:.34em;text-transform:uppercase;opacity:0;transition:opacity 1.6s;pointer-events:none;z-index:4;text-shadow:0 1px 10px rgba(0,0,0,.6)}
#hint.on{opacity:.62}
#site{position:fixed;left:max(18px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));font:400 11px Manrope,sans-serif;letter-spacing:.14em;color:var(--ink);opacity:.6;text-decoration:none;z-index:4}
#site:hover{opacity:1}
@media (max-aspect-ratio:1/1){#site{display:none}}
#sheet{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(2,10,10,.55);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);opacity:0;pointer-events:none;transition:opacity .35s}
#sheet.open{opacity:1;pointer-events:auto}
.card{width:min(92vw,430px);max-height:92vh;overflow:auto;padding:24px 22px 18px;border-radius:24px;background:var(--card);border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.45);transform:translateY(14px);transition:transform .4s}
#sheet.open .card{transform:none}
.card h2{margin:0 0 16px;font:italic 600 26px "Cormorant Garamond",Georgia,serif;text-align:center}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px}
.sb{display:flex;flex-direction:column;align-items:center;gap:7px;font:500 11px Manrope,sans-serif;color:var(--ink);text-decoration:none;background:none;border:0;cursor:pointer;padding:0}
.sb span{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 17px Manrope,sans-serif;transition:transform .2s}
.sb:hover span{transform:scale(1.1)}
.contacts{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;font:400 12px Manrope,sans-serif}
.contacts a{color:var(--ink);opacity:.8}
.contacts a:hover{opacity:1}
.cl{display:block;margin:14px auto 0;background:none;border:0;color:var(--ink);opacity:.6;font:500 12px Manrope,sans-serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
#veil{position:fixed;inset:0;z-index:30;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 40%,rgba(6,34,36,.55),rgba(2,10,12,.86));-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);transition:opacity 2.2s ease,filter 2.2s ease,transform 2.2s ease;color:#f6ecd3}
#veil.go{opacity:0;filter:blur(20px);transform:scale(1.1);pointer-events:none}
#veil h1{margin:0;font:italic 600 clamp(40px,9vw,84px)/1.05 "Cormorant Garamond",Georgia,serif;letter-spacing:.02em;background:linear-gradient(180deg,#fff0b8,#e5ad3a 60%,#a4701a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 14px rgba(0,0,0,.5))}
#veil .sub{margin:14px 0 34px;font:300 11px Manrope,sans-serif;letter-spacing:.34em;text-transform:uppercase;opacity:.8}
#enter{font:500 13px Manrope,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#1a1204;background:linear-gradient(180deg,#ffe9a3,#e3ab35);border:0;border-radius:40px;padding:16px 38px;cursor:pointer;box-shadow:0 10px 40px rgba(227,171,53,.35);transition:transform .25s,box-shadow .25s}
#enter:hover,#enter:focus-visible{transform:translateY(-2px) scale(1.03);box-shadow:0 14px 50px rgba(227,171,53,.5);outline:none}
#veil .note{margin:16px 0 0;font:300 11px Manrope,sans-serif;letter-spacing:.12em;opacity:.55}
#silent{margin-top:10px;background:none;border:0;color:#f6ecd3;opacity:.7;font:400 12px Manrope,sans-serif;letter-spacing:.14em;text-decoration:underline;text-underline-offset:4px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:70px;transform:translate(-50%,20px);background:var(--card);border:1px solid var(--line);color:var(--ink);padding:11px 20px;border-radius:30px;font:500 13px Manrope,sans-serif;opacity:0;pointer-events:none;transition:.4s;z-index:40}
#toast.on{opacity:1;transform:translate(-50%,0)}
#fallback{display:none;position:fixed;inset:0;z-index:2;background:#04100f;overflow:auto;padding:24px;text-align:center}
#fallback img{max-width:min(90vw,420px);max-height:70vh;border-radius:14px}
#fallback p{font:italic 600 22px "Cormorant Garamond",Georgia,serif;color:#f3cf7a;max-width:520px;margin:18px auto}
.nogl #fallback{display:block}
.nogl #gl,.nogl #veil{display:none}
@media (prefers-reduced-motion:reduce){#bSound:not(.on){animation:none}}
</style>

Fish.prototype.update=function(dt){
  this.tt-=dt;

    fctx.fillStyle='rgba(200,235,255,.07)';fctx.fill();

    fctx.beginPath();fctx.arc(b.x-b.r*.35,b.y-b.r*.35,Math.max(.5,b.r*.22),0,6.2832);
    fctx.fillStyle='rgba(255,255,255,.55)';fctx.fill();
  }
  drawSea(dt,t);
  if(S.buryDir!==0){
    for(var p=0;p<4;p++){
      var r=S.pr[p];if(!r||r[2]<=r[0])continue;
      if(S.bury[p]>0.02&&S.bury[p]<0.98&&grains.length<160){
        for(var k=0;k<2;k++){
          if(S.buryDir>0)grains.push({x:rand(r[0],r[2]),y:r[1]-rand(0,24),vx:rand(-6,6),vy:rand(40,90),l:rand(1.6,3)});
          else grains.push({x:rand(r[0],r[2]),y:rand(r[1],r[3]),vx:(Math.random()<.5?-1:1)*rand(30,80),vy:rand(-10,10),l:rand(.9,1.8)});
        }
      }
    }
  }
  fctx.globalCompositeOperation='lighter';
  for(i=sparks.length-1;i>=0;i--){
    var sk=sparks[i];sk.l-=dt;if(sk.l<=0){sparks.splice(i,1);continue}
    sk.vy+=sk.g*dt;sk.x+=sk.vx*dt;sk.y+=sk.vy*dt;sk.vx*=1-dt*.8;
    var al=clamp(sk.l/sk.l0*1.6,0,1);
    if(sk.drop){fctx.fillStyle='rgba(200,235,255,'+(al*.7).toFixed(2)+')';fctx.beginPath();fctx.arc(sk.x,sk.y,sk.r*.6,0,6.2832);fctx.fill()}
    else{fctx.fillStyle='rgba(255,224,140,'+al.toFixed(2)+')';drawStar(fctx,sk.x,sk.y,sk.r*(.6+.5*Math.sin(t*20+i)))}
  }
  fctx.globalCompositeOperation='source-over';
  for(i=grains.length-1;i>=0;i--){
    var gr=grains[i];gr.l-=dt;gr.x+=gr.vx*dt;gr.y+=gr.vy*dt;
    if(gr.l<=0){grains.splice(i,1);continue}
    fctx.fillStyle='rgba(222,196,142,'+Math.min(.85,gr.l).toFixed(2)+')';fctx.fillRect(gr.x,gr.y,1.8,1.8);
  }
}

var rips=[];for(var ri=0;ri<20;ri++)rips.push(null);
function addRipple(x,y,a,soft){
  var slot=-1,oldest=0,ot=1e9,freeN=0;
  if(soft){for(var q=0;q<20;q++){var rq=rips[q];if(!rq||now-rq.t>=CFG.rippleLife)freeN++}if(freeN<7)return}
  for(var i=0;i<20;i++){
    var r=rips[i];
    if(!r||now-r.t>=CFG.rippleLife){slot=i;break}
    if(r.t<ot){ot=r.t;oldest=i}
  }
  if(slot<0)slot=oldest;
  rips[slot]={x:x,y:y,t:now,a:a};
}

  S.buryDir=-1;S.buryT0=now;S.buryState='emerging';
  if(!S.lettersOn||tw.start+tw.dur<now){S.lettersOn=true;tw.start=now+0.7;S.lines.forEach(function(l){l.chars.forEach(function(c){c.played=false})})}
  else{tw.start=now+0.7;S.lines.forEach(function(l){l.chars.forEach(function(c){c.played=false})})}
  textDirty=true;Snd.sand(false);Snd.emerge();
}
function activity(){
  S.lastActive=now;
  if(S.started&&(S.buryState==='burying'||S.buryState==='buried'))wake();
  $('#hint').classList.remove('on');
}
var pt={x:0,y:0,t:0,travel:0,down:false,lastRip:0,lastSw:0};
function startle(x,y){
  for(var q2=0;q2<fry.length;q2++){var fy=fry[q2],fdx=fy.x-x,fdy=fy.y-y;if(fdx*fdx+fdy*fdy<170*170){fy.st=1.2;fy.a=Math.atan2(fdy,fdx)}}
  for(var i=0;i<fishes.length;i++){
    var f=fishes[i],dx=f.x-x,dy=f.y-y;
    if(dx*dx+dy*dy<150*150){f.st=1;f.tx=f.x+dx*3;f.ty=f.y+dy*3;f.tt=2.5}
  }
}
window.addEventListener('pointerdown',function(e){
  pt.down=true;pt.x=e.clientX;pt.y=e.clientY;pt.t=now;pt.travel=0;
  activity();
  addRipple(e.clientX,e.clientY,CFG.touchAmp);
  Snd.touch(e.clientX/S.W,1);startle(e.clientX,e.clientY);
  spawnSpark(e.clientX,e.clientY,18,90);spawnSpark(e.clientX,e.clientY,8,70,true);
  if(S.started&&leaves.length<26){for(var lk=0;lk<3;lk++){var nl=newLeaf(false);nl.x=e.clientX;nl.y=e.clientY;nl.vx=rand(-60,60);nl.vy=rand(-50,50);nl.s=rand(9,16);nl.tmp=true;nl.life=rand(9,15);leaves.push(nl)}}
  for(var bb=0;bb<6;bb++)bubbles.push({x:e.clientX+rand(-14,14),y:e.clientY+rand(-6,10),r:rand(1.5,4.5),vy:rand(40,90),ph:rand(0,6.28),burst:true});
},{passive:true});
window.addEventListener('pointermove',function(e){
  S.parT.x=-(e.clientX/S.W-.5)*18;S.parT.y=-(e.clientY/S.H-.5)*13;
  var dx=e.clientX-pt.x,dy=e.clientY-pt.y,dist=Math.sqrt(dx*dx+dy*dy),dt=Math.max(.008,now-pt.t);
  if(e.pointerType!=='mouse'&&!pt.down){pt.x=e.clientX;pt.y=e.clientY;return}
  if(dist<1)return;
  var speed=dist/dt;pt.x=e.clientX;pt.y=e.clientY;pt.t=now;pt.travel+=dist;
  activity();
  if(pt.travel>34&&now-pt.lastRip>0.07){
    pt.travel=0;pt.lastRip=now;
    addRipple(e.clientX,e.clientY,clamp(0.9+speed*0.0011,0.9,1.9));spawnSpark(e.clientX,e.clientY,2,34);
  }
  if(now-pt.lastSw>0.12&&speed>120){pt.lastSw=now;Snd.swish(e.clientX/S.W,speed/1600)}
  if(speed>400)startle(e.clientX,e.clientY);
},{passive:true});
window.addEventListener('deviceorientation',function(e){if(e.gamma==null)return;S.parT.x=-clamp(e.gamma/28,-1,1)*9;S.parT.y=-clamp(((e.beta||50)-50)/28,-1,1)*7},{passive:true});
window.addEventListener('pointerup',function(){pt.down=false},{passive:true});
window.addEventListener('pointercancel',function(){pt.down=false},{passive:true});
window.addEventListener('resize',function(){clearTimeout(resize.t);resize.t=setTimeout(resize,120)});
window.addEventListener('orientationchange',function(){setTimeout(resize,250)});

/* ================= ГЛАВЕН ЦИКЪЛ ================= */
var last=0,nextRain=1.0,frames=0,accDt=0,lastAdapt=0;
var rArr=new Float32Array(80),prArr=new Float32Array(16),bArr=new Float32Array(4);

function frame(ms){
  requestAnimationFrame(frame);
  var t=ms/1000,dt=t-last;last=t;if(dt>0.1)dt=0.1;if(dt<=0)return;
  if(document.hidden)return;
  now=t;
  if(S.theme!==S.themeT){S.theme+=(S.themeT-S.theme)*Math.min(1,dt*3.2);if(Math.abs(S.themeT-S.theme)<0.003)S.theme=S.themeT;textDirty=true}
  if(S.intro<1)S.intro=Math.min(1,S.intro+dt*0.55);

  // дъжд
  nextRain-=dt;
  if(nextRain<=0){
    nextRain=rand(0.3,0.85)/CFG.rainRate*1.1;
    var rx=rand(0.04,0.96)*S.W,ry=rand(0.05,0.95)*S.H;
    addRipple(rx,ry,CFG.rainAmp*rand(.7,1.15));Snd.drop(rx/S.W,rand(.5,1));spawnSpark(rx,ry,5,50,true);
    if(Math.random()<.12){var rx2=rand(0.04,0.96)*S.W,ry2=rand(0.05,0.95)*S.H;addRipple(rx2,ry2,CFG.rainAmp*.8);setTimeout(function(){Snd.drop(rx2/S.W,.6)},140)}
  }
  if(Math.random()<dt/6)Snd.bubble();
  waveT-=dt;if(waveT<=0){waveT=rand(13,22);Snd.wave()}

  // състояние на текста
  var writeEnd=tw.start+tw.dur;
  if(S.started&&S.buryState==='none'&&S.lettersOn&&t>writeEnd&&t-Math.max(S.lastActive,writeEnd)>CFG.idleBury){
    S.buryState='burying';S.buryDir=1;S.buryT0=t;Snd.sand(true);
  }
  if(S.buryDir!==0){
    var clock=t-S.buryT0,done=true;
    for(var p=0;p<4;p++){
      var delay=S.buryDir>0?p*0.9:p*0.3;
      if(clock>delay)S.bury[p]=clamp(S.bury[p]+S.buryDir*dt/(S.buryDir>0?5.5:3.0),0,1);
      if(S.buryDir>0?S.bury[p]<1:S.bury[p]>0)done=false;
    }
    if(done){
      if(S.buryDir>0){S.buryState='buried';S.lettersOn=false;textDirty=true;Snd.sand(false)}
      else S.buryState='none';
      S.buryDir=0;
    }
  }
  var writing=S.lettersOn&&t-tw.start<tw.dur+0.1;
  if(S.lettersOn&&t>=tw.start){
    var el=t-tw.start;
    for(var i=0;i<S.lines.length;i++){
      var cs=S.lines[i].chars;
      for(var j=0;j<cs.length;j++){
        var ch=cs[j];
        if(!ch.played&&el>=ch.t0){ch.played=true;if(ch.c!==' '){spawnSpark(S.lines[i].x+ch.x+ch.w/2,S.lines[i].y-S.lines[i].sz*.3,2,38);if(j===0||cs[j-1].c===' ')Snd.chime()}}
      }
    }
  }
  if((writing||textDirty)&&t-lastTextDraw>0.033){
    drawText(t);uploadCanvas(1,texText,tc);lastTextDraw=t;
    textDirty=(S.theme!==S.themeT);
  }

  // ефекти и рисуване
  drawFx(dt,t);uploadCanvas(2,texFx,fc);

  gl.uniform2f(U.uSize,S.W,S.H);
  gl.uniform1f(U.uTime,t);gl.uniform1f(U.uTheme,S.theme);gl.uniform1f(U.uIntro,S.intro);
  var ph=S.ph;
  S.par.x+=(S.parT.x-S.par.x)*Math.min(1,dt*2.5);S.par.y+=(S.parT.y-S.par.y)*Math.min(1,dt*2.5);
  gl.uniform4f(U.uPh,ph.x+Math.sin(t*.45)*1.5+S.par.x,ph.y+Math.sin(t*.7)*3.5+S.par.y,ph.w,ph.h);
  var zt=S.started?clamp((t-S.t0)/4.5,0,1):0;
  gl.uniform1f(U.uZoom,1+0.16*Math.pow(1-zt,3));
  for(var k=0;k<20;k++){
    var r=rips[k],age=r?t-r.t:99;
    if(r&&age<CFG.rippleLife){rArr[k*4]=r.x;rArr[k*4+1]=r.y;rArr[k*4+2]=age;rArr[k*4+3]=r.a}
    else{rArr[k*4+3]=0;rArr[k*4+2]=99}
  }
  gl.uniform4fv(U.uR,rArr);
  for(k=0;k<4;k++){var q=S.pr[k];prArr[k*4]=q[0];prArr[k*4+1]=q[1];prArr[k*4+2]=q[2];prArr[k*4+3]=q[3];bArr[k]=S.bury[k]}
  gl.uniform4fv(U.uPR,prArr);gl.uniform1fv(U.uB,bArr);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);

  // автоматично намаляване на резолюцията при бавно устройство
  frames++;accDt+=dt;
  if(frames>=90){
    var avg=accDt/frames;frames=0;accDt=0;
    if(avg>0.026&&S.rs>0.55&&t-lastAdapt>3){S.rs=Math.max(0.55,S.rs-0.15);lastAdapt=t;resize()}
  }
}

/* ================= СТАРТ ================= */
if(coarse)S.rs=0.9;
applyTheme();applyLang();resize();initFx();
var fontP=document.fonts&&document.fonts.load?Promise.all([document.fonts.load('italic 600 40px "Cormorant Garamond"','Миглена Aa'),document.fonts.load('600 14px Manrope','Aa')]):Promise.resolve();
Promise.race([fontP,new Promise(function(r){setTimeout(r,2500)})]).then(function(){layoutText();textDirty=true});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){layoutText();textDirty=true});
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
